---
gitea_runner_install_dependencies: true
gitea_runner_user: gitea_runner
gitea_runner_user_group: gitea_runner
gitea_runner_user_additional_groups: ''
gitea_runner_user_home: /home/{{ gitea_runner_user }}

gitea_runner_bin_dir: /usr/local/bin
gitea_runner_bin_owner: root
gitea_runner_bin_owner_group: root

gitea_runner_version: "1.0.6"
gitea_runner_download_url: "https://gitea.com/gitea/runner/releases/download/v{{ gitea_runner_version }}"
# To track the nightly channel instead of a tagged release, set:
#   gitea_runner_version: "nightly"
#   gitea_runner_download_url: "https://dl.gitea.com/gitea-runner/nightly"
# The artifact name derives correctly from the version either way. Note that a
# nightly binary reports a git-describe version (v3.3.0-9-g0712b2a7), which
# never equals "nightly", so the update block below is evaluated on every run --
# that is intended for a moving channel, and the download tasks stay idempotent.
# An empty value for gitea_runner_config_content will generate a default config.yaml
gitea_runner_config_content: ''

gitea_runner_gitea_config_path: /etc/gitea/gitea.ini
gitea_runner_do_register: false
# For a scoped runner, enter owner/repo, for global runner leave as ''
gitea_runner_scope: ''

gitea_runner_gitea_host: gitea.example.com
gitea_runner_gitea_host_port: 443
gitea_runner_gitea_host_protocol: https
gitea_runner_gitea_become_user: root
gitea_runner_gitea_bin: /usr/local/bin/gitea

gitea_runner_labels:
  - ubuntu-latest
  - ubuntu-22.04
  - ubuntu-20.04

# How gitea_runner_labels is applied to a runner that is already registered:
#   exact  - the runner ends up with exactly the labels in gitea_runner_labels
#   merged - the labels the runner already has are the starting point, and
#            gitea_runner_labels_add / gitea_runner_labels_remove are applied
#            to them. gitea_runner_labels is only used for a runner that has
#            no labels of its own yet.
gitea_runner_labels_state: exact
gitea_runner_labels_add: []
gitea_runner_labels_remove: []
