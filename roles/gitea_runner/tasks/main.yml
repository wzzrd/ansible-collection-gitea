---
- name: Ensure installation of podman-docker
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - podman-docker
  when: gitea_runner_install_dependencies is true

- name: Add group for gitea_runner user
  ansible.builtin.group:
    name: "{{ gitea_runner_user_group }}"

- name: Add user for gitea_runner
  ansible.builtin.user:
    name: "{{ gitea_runner_user }}"
    group: "{{ gitea_runner_user_group }}"
    groups: "{{ gitea_runner_user_additional_groups | default('') }}"
    home: "{{ gitea_runner_user_home }}"
    create_home: true

# The daemon resolves its labels as --labels > runner.labels in config.yaml >
# the labels in the .runner file, and declares whatever it resolves to the
# Gitea server on every start. Putting the labels on the daemon command line is
# therefore the one place from which the role can both set them at registration
# time and change them afterwards.
- name: Determine the labels the gitea-runner daemon should run with
  tags:
    - labels
  block:
    - name: Preflight check for the requested label state
      ansible.builtin.assert:
        that:
          - gitea_runner_labels_state in ['exact', 'merged']
        fail_msg: "gitea_runner_labels_state must be either 'exact' or 'merged'"

    - name: Use the requested labels verbatim
      ansible.builtin.set_fact:
        gitea_runner_effective_labels: "{{ gitea_runner_labels }}"
      when: gitea_runner_labels_state == 'exact'

    - name: Merge the requested label changes into the labels of the runner
      when: gitea_runner_labels_state == 'merged'
      block:
        - name: Check for an existing runner registration file
          ansible.builtin.stat:
            path: "{{ gitea_runner_user_home }}/.runner"
          register: gitea_runner_registration_stat

        - name: Read the existing runner registration file
          ansible.builtin.slurp:
            src: "{{ gitea_runner_user_home }}/.runner"
          register: gitea_runner_registration_raw
          when: gitea_runner_registration_stat.stat.exists

        # A runner that is not registered yet has no labels of its own, so for
        # that one the labels in gitea_runner_labels are the starting point.
        - name: Start from the labels in gitea_runner_labels
          ansible.builtin.set_fact:
            gitea_runner_current_labels: "{{ gitea_runner_labels }}"

        - name: Start from the labels the runner already has
          ansible.builtin.set_fact:
            gitea_runner_current_labels: "{{ gitea_runner_registration.labels }}"
          vars:
            gitea_runner_registration: "{{ gitea_runner_registration_raw.content | b64decode | from_json }}"
          when:
            - gitea_runner_registration_raw.content is defined
            - gitea_runner_registration.labels | default([], true) | length > 0

        # Labels are matched on their name, the part before the first colon, so
        # that adding a label that already exists repoints it at another image
        # instead of ending up with the same name twice.
        - name: Determine which label names are replaced or removed
          ansible.builtin.set_fact:
            gitea_runner_dropped_label_names: "{{ (gitea_runner_labels_add + gitea_runner_labels_remove) | map('regex_replace', ':.*$', '') | list }}"

        - name: Reset the list of labels to keep
          ansible.builtin.set_fact:
            gitea_runner_kept_labels: []

        - name: Keep the current labels that are not replaced or removed
          ansible.builtin.set_fact:
            gitea_runner_kept_labels: "{{ gitea_runner_kept_labels + [item] }}"
          loop: "{{ gitea_runner_current_labels }}"
          when: (item | regex_replace(':.*$', '')) not in gitea_runner_dropped_label_names

        - name: Add the requested labels to the labels that were kept
          ansible.builtin.set_fact:
            gitea_runner_effective_labels: "{{ gitea_runner_kept_labels + gitea_runner_labels_add }}"

    - name: Show the labels the daemon will run with
      ansible.builtin.debug:
        msg: "{{ gitea_runner_effective_labels }}"
      when:
        - debug is defined
        - debug

- name: Check if gitea-runner is installed already
  ansible.builtin.stat:
    path: "{{ gitea_runner_bin_dir }}/gitea-runner"
  register: gitea_runner_stat

- name: Deploy systemd service file
  ansible.builtin.template:
    src: "gitea_runner.service.j2"
    dest: "/etc/systemd/system/gitea_runner.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart gitea_runner

- name: Check if gitea-runner is already installed and get version if so
  when: gitea_runner_stat.stat.exists
  tags:
    - version
  block:
    - name: Get version of currently installed gitea-runner
      ansible.builtin.command:
        argv:
          - "{{ gitea_runner_bin_dir }}/gitea-runner"
          - -v
      register: version_output
      changed_when: false

    - name: Store detected version for later
      ansible.builtin.set_fact:
        detected_version: "{{ version_output.stdout | split | last }}"

    - name: Show values
      ansible.builtin.debug:
        msg: "{{ detected_version }}"
      when:
        - debug is defined
        - debug

- name: Download and install new binary, if needed
  when: (detected_version is not defined) or
        (gitea_runner_version != detected_version[1:])
  notify: Restart gitea_runner
  tags:
    - version
  block:
    - name: Get system architecture in supported format - amd64
      ansible.builtin.set_fact:
        gitea_runner_architecture: amd64
        gitea_runner_artifact: "gitea-runner-{{ gitea_runner_version }}-linux-amd64.xz"
      when: ansible_architecture == "x86_64"

    - name: Get system architecture in supported format - arm64
      ansible.builtin.set_fact:
        gitea_runner_architecture: arm64
        gitea_runner_artifact: "gitea-runner-{{ gitea_runner_version }}-linux-arm64.xz"
      when: ansible_architecture == "aarch64"

    - name: Show artifact
      ansible.builtin.debug:
        msg: "{{ gitea_runner_artifact }}"
      when:
        - debug is defined
        - debug

    - name: Download checksum file for artifact
      ansible.builtin.get_url:
        url: "{{ gitea_runner_download_url }}/{{ gitea_runner_artifact }}.sha256"
        dest: "{{ gitea_runner_user_home }}/{{ gitea_runner_artifact }}.sha256"
        owner: "{{ gitea_runner_user }}"
        mode: "0640"
        force: true

    - name: Read checksum file
      ansible.builtin.slurp:
        src: "{{ gitea_runner_user_home }}/{{ gitea_runner_artifact }}.sha256"
      register: gitea_runner_checksum_file

    - name: Extract checksum from file
      ansible.builtin.set_fact:
        gitea_runner_checksum: "{{ gitea_runner_checksum_file['content'] | b64decode | split | first }}"

    - name: Show checksum value
      ansible.builtin.debug:
        msg: "{{ gitea_runner_checksum }}"
      when:
        - debug is defined
        - debug

    # unxz -k below keeps the archive on disk, so this task can compare its
    # checksum on the next run and skip the download entirely. That is what
    # keeps a fixed-name channel such as nightly idempotent.
    - name: Download requested release
      ansible.builtin.get_url:
        url: "{{ gitea_runner_download_url }}/{{ gitea_runner_artifact }}"
        dest: "{{ gitea_runner_user_home }}/{{ gitea_runner_artifact }}"
        checksum: "sha256:{{ gitea_runner_checksum }}"
        owner: "{{ gitea_runner_user }}"
        mode: "0750"

    # Deliberately unguarded: on a moving channel the artifact filename never
    # changes, so a creates: guard would skip decompression and leave the
    # previously installed build in place while reporting success. Decompressing
    # into the runner home changes nothing on the system, so the copy task below
    # is what reports the change and triggers the restart.
    - name: Unarchive release
      ansible.builtin.command:
        argv:
          - /usr/bin/unxz
          - -d
          - -f
          - -k
          - "{{ gitea_runner_user_home }}/{{ gitea_runner_artifact }}"
      changed_when: false

    - name: "Copy file to {{ gitea_runner_bin_dir }}"
      ansible.builtin.copy:
        src: "{{ gitea_runner_user_home }}/{{ gitea_runner_artifact[:-3] }}"
        dest: "{{ gitea_runner_bin_dir }}/{{ gitea_runner_artifact[:-3] }}"
        mode: "0755"
        owner: "{{ gitea_runner_bin_owner }}"
        group: "{{ gitea_runner_bin_owner_group }}"
        remote_src: true

    - name: Create current symlink
      ansible.builtin.file:
        src: "{{ gitea_runner_bin_dir }}/{{ gitea_runner_artifact[:-3] }}"
        dest: "{{ gitea_runner_bin_dir }}/gitea-runner"
        state: "link"

- name: Generate default gitea-runner config file if it doesn't exist
  ansible.builtin.command:
    chdir: "{{ gitea_runner_user_home }}"
    creates: "{{ gitea_runner_user_home }}/config.yaml"
    argv:
      - "{{ gitea_runner_bin_dir }}/gitea-runner"
      - generate-config
  register: gitea_runner_config_content
  when:
    - gitea_runner_config_content is not defined or gitea_runner_config_content == ''

- name: Flatten gitea_runner_config_content
  ansible.builtin.set_fact:
    gitea_runner_config_content: "{{ gitea_runner_config_content.stdout }}"
  when: gitea_runner_config_content.stdout is defined

- name: Generate gitea-runner config file with specific contents
  ansible.builtin.copy:
    dest: "{{ gitea_runner_user_home }}/config.yaml"
    mode: "0640"
    owner: "{{ gitea_runner_user }}"
    group: "{{ gitea_runner_user_group }}"
    content: "{{ gitea_runner_config_content }}"
    force: false
  when:
    - gitea_runner_config_content is defined and gitea_runner_config_content != ''

- name: Register runner with gitea server
  when: gitea_runner_do_register
  block:
    - name: Preflight checks for gitea-runner registration
      ansible.builtin.assert:
        that:
          - gitea_runner_gitea_host is defined
          - gitea_runner_gitea_become_user is defined
          - gitea_runner_gitea_bin is defined
          - gitea_runner_gitea_config_path is defined
          - gitea_runner_effective_labels | length > 0

    - name: Obtain registration token with project and / or owner scope
      ansible.builtin.shell:
        cmd: "{{ gitea_runner_gitea_bin }} actions generate-runner-token --config {{ gitea_runner_gitea_config_path }} --scope {{ gitea_runner_scope }}"
      register: gitea_runner_registration_token
      when: gitea_runner_scope|length > 0
      changed_when: false
      delegate_to: "{{ gitea_runner_gitea_host }}"
      become: true
      become_user: "{{ gitea_runner_gitea_become_user }}"

    - name: Obtain global registration token (without project and / or owner scope)
      ansible.builtin.shell:
        cmd: "{{ gitea_runner_gitea_bin }} actions generate-runner-token --config {{ gitea_runner_gitea_config_path }}"
      register: gitea_runner_registration_token
      when: gitea_runner_scope|length == 0
      changed_when: false
      delegate_to: "{{ gitea_runner_gitea_host }}"
      become: true
      become_user: "{{ gitea_runner_gitea_become_user }}"

    # Should no longer be a problem with gitea 1.23 or so
    - name: Work around DISABLE_QUERY_AUTH_TOKEN bug
      block:
        - name: Select stdout as token if DISABLE_QUERY_AUTH_TOKEN is not a problem
          ansible.builtin.set_fact:
            gitea_runner_registration_token: "{{ gitea_runner_registration_token.stdout }}"
          when: "'DISABLE_QUERY_AUTH_TOKEN' not in gitea_runner_registration_token.stdout"

        - name: Select stdout_lines[1] if DISABLE_QUERY_AUTH_TOKEN is a problem
          ansible.builtin.set_fact:
            gitea_runner_registration_token: "{{ gitea_runner_registration_token.stdout_lines[1] }}"
          when:
            - gitea_runner_registration_token.stdout is defined
            - "'DISABLE_QUERY_AUTH_TOKEN' in gitea_runner_registration_token.stdout"

    - name: Show registration token
      ansible.builtin.debug:
        msg: "{{ gitea_runner_registration_token }}"
      when:
        - debug is defined
        - debug

    - name: Fail if no registration token was acquired
      ansible.builtin.fail:
        msg: "Failure: no registration token was acquired successfully."
      when: (gitea_runner_registration_token | length) != 40

    - name: Register runner
      ansible.builtin.command:
        chdir: "{{ gitea_runner_user_home }}"
        creates: "{{ gitea_runner_user_home }}/.runner"
        argv:
          - "{{ gitea_runner_bin_dir }}/gitea-runner"
          - register
          - --instance
          - "{{ gitea_runner_gitea_host_protocol }}://\
             {{ gitea_runner_gitea_host }}:\
             {{ gitea_runner_gitea_host_port }}"
          - --labels
          - "{{ gitea_runner_effective_labels | join(',') }}"
          - --token
          - "{{ gitea_runner_registration_token }}"
          - --name
          - "{{ ansible_hostname }}"
          - --no-interactive
      become: true
      become_user: "{{ gitea_runner_user }}"

    - name: Make sure gitea_runner daemon is always running
      ansible.builtin.service:
        name: gitea_runner
        enabled: true
        state: started
