- name: Verify
  hosts: all
  # We disable gather facts because it would fail due to our container not
  # having python installed. This will not prevent use from running 'raw'
  # commands. Most molecule users are expected to use containers that already
  # have python installed in order to avoid notable delays installing it.
  gather_facts: false

  tasks:
    - name: Check if gitea-runner binary exists
      block:
        - name: Check for existence of /usr/local/bin/gitea-runner
          ansible.builtin.stat:
            path: /usr/local/bin/gitea-runner
          register: gitea_runner_stat_result

        - name: Verify result of previous task
          ansible.builtin.assert:
            that:
              - gitea_runner_stat_result.stat.exists

    - name: Check if gitea-runner config file exists
      block:
        - name: Check for existence of /home/gitea_runner/config.yaml
          ansible.builtin.stat:
            path: "/home/gitea_runner/config.yaml"
          register: gitea_runner_config_stat_result

        - name: Verify result of previous task
          ansible.builtin.assert:
            that:
              - gitea_runner_config_stat_result.stat.exists
              - gitea_runner_config_stat_result.stat.size > 1000
